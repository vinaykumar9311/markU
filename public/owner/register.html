<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enroll Your Shop · MarkU</title>
  <!-- Progressive Web App (PWA) Manifest & Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MarkU">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK Compat for SMS OTP -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased">

  <!-- Header -->
  <header class="max-w-md w-full mx-auto pt-4 flex justify-between items-center">
    <a href="/" class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-bold text-sm flex items-center justify-center">M</span>
      <span class="font-bold text-base tracking-tight text-gray-900">MarkU</span>
    </a>
    <a href="/owner/login.html" class="text-xs text-gray-600 hover:text-gray-900 font-medium">Already registered? Log in</a>
  </header>

  <!-- Register Card -->
  <main class="w-full max-w-md mx-auto my-6 bg-white border border-gray-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-5">
    
    <div>
      <div class="flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-900">Enroll Your Shop</h1>
        <span id="authBadge" class="text-[11px] font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 px-2.5 py-0.5 rounded-full">
          Phone Verification
        </span>
      </div>
      <p class="text-xs text-gray-500 mt-1">Register with your mobile number to launch your counter terminal in 60 seconds.</p>
    </div>

    <div id="errorBanner" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl p-3"></div>

    <form onsubmit="handleSendOtp(event)" class="space-y-4">
      
      <!-- Shop Name -->
      <div>
        <label for="shopName" class="block text-xs font-semibold text-gray-700 mb-1">Shop / Business Name</label>
        <input type="text" id="shopName" required placeholder="e.g. Royal Cafe" oninput="autoSlug()"
          class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>

      <!-- Shop Slug -->
      <div>
        <label for="slug" class="block text-xs font-semibold text-gray-700 mb-1">Shop Slug (Counter URL)</label>
        <div class="flex items-center bg-gray-50 border border-gray-300 rounded-xl px-3.5 py-2 text-xs text-gray-500 font-mono focus-within:ring-2 focus-within:ring-indigo-500">
          <span>/shop/</span>
          <input type="text" id="slug" required placeholder="royal-cafe"
            class="bg-transparent text-gray-900 focus:outline-none flex-1 ml-1 font-mono text-xs">
        </div>
      </div>

      <!-- Reward & Target Stamps -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="col-span-2">
          <label for="reward" class="block text-xs font-semibold text-gray-700 mb-1">Reward Item</label>
          <input type="text" id="reward" placeholder="e.g. Free Coffee"
            class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label for="stampsTarget" class="block text-xs font-semibold text-gray-700 mb-1">Stamps Target</label>
          <input type="number" id="stampsTarget" value="10" min="2" max="50"
            class="w-full bg-white border border-gray-300 rounded-xl px-3 py-2 text-sm text-gray-900 font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <!-- Phone Number Verification Section -->
      <div class="border-t border-gray-100 pt-3 space-y-3">
        
        <div id="phoneInputGroup">
          <label for="phone" class="block text-xs font-semibold text-gray-700 mb-1">Owner Mobile Number</label>
          <input type="tel" id="phone" required placeholder="+919876543210"
            class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm text-gray-900 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
          <p class="text-[11px] text-gray-400 mt-1">We'll verify your number via SMS OTP.</p>
        </div>

        <div id="recaptcha-container"></div>

        <div id="otpInputGroup" class="hidden space-y-2">
          <label for="otpCode" class="block text-xs font-semibold text-gray-700">Enter 6-Digit SMS Code</label>
          <input type="text" id="otpCode" maxlength="6" placeholder="123456"
            class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-base font-mono text-center tracking-widest text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <div class="flex justify-between items-center text-xs text-gray-500">
            <span id="targetPhoneLabel">Code sent to mobile</span>
            <button type="button" onclick="backToPhone()" class="text-indigo-600 hover:underline">Change number</button>
          </div>
        </div>

      </div>

      <!-- Primary Action Button -->
      <button type="submit" id="mainActionBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-sm">
        Send Verification Code &rarr;
      </button>

    </form>

    <div class="text-center text-xs text-gray-500 pt-3 border-t border-gray-100">
      Already enrolled? <a href="/owner/login.html" class="text-indigo-600 font-semibold hover:underline">Sign in to your shop</a>
    </div>

  </main>

  <footer class="max-w-md w-full mx-auto pb-4 text-center text-xs text-gray-400">
    MarkU Loyalty Platform
  </footer>

  <script>
    let firebaseConfig = null;
    let confirmationResult = null;
    let recaptchaVerifier = null;
    let isOtpSent = false;
    let currentPhone = '';

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/config/firebase');
        firebaseConfig = await res.json();
        if (firebaseConfig.isConfigured && window.firebase) {
          firebase.initializeApp(firebaseConfig);
          recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
          document.getElementById('authBadge').textContent = 'SMS OTP Active';
        } else {
          document.getElementById('authBadge').textContent = 'Direct Phone Registration';
          document.getElementById('mainActionBtn').textContent = 'Enroll Shop & Launch Counter →';
        }
      } catch (err) {
        console.warn('Firebase init:', err);
      }
    });

    function autoSlug() {
      const name = document.getElementById('shopName').value;
      document.getElementById('slug').value = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
    }

    function backToPhone() {
      isOtpSent = false;
      document.getElementById('phoneInputGroup').classList.remove('hidden');
      document.getElementById('otpInputGroup').classList.add('hidden');
      document.getElementById('mainActionBtn').textContent = 'Send Verification Code →';
    }

    async function handleSendOtp(e) {
      e.preventDefault();
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.classList.add('hidden');

      if (isOtpSent) {
        // If OTP is already sent, this submission verifies OTP and finishes registration
        await verifyOtpAndRegister();
        return;
      }

      let rawPhone = document.getElementById('phone').value.trim();
      let cleaned = rawPhone.replace(/[\s\-\(\)]/g, '');
      if (!cleaned.startsWith('+')) {
        if (cleaned.length === 10) cleaned = '+91' + cleaned;
        else cleaned = '+' + cleaned;
      }

      if (!cleaned || cleaned.length < 10) {
        showError('Please enter a valid 10-digit mobile number.');
        return;
      }
      currentPhone = cleaned;

      const btn = document.getElementById('mainActionBtn');
      btn.disabled = true;

      // If Firebase Phone Auth is initialized
      if (firebaseConfig && firebaseConfig.isConfigured && window.firebase) {
        btn.textContent = 'Sending SMS Code...';
        try {
          if (!recaptchaVerifier) {
            recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
          }
          confirmationResult = await firebase.auth().signInWithPhoneNumber(currentPhone, recaptchaVerifier);
          isOtpSent = true;
          document.getElementById('phoneInputGroup').classList.add('hidden');
          document.getElementById('otpInputGroup').classList.remove('hidden');
          document.getElementById('targetPhoneLabel').textContent = `Code sent to ${currentPhone}`;
          btn.textContent = 'Verify Code & Enroll Shop →';
        } catch (err) {
          console.error(err);
          const msg = err.message || '';
          if (window.grecaptcha && recaptchaVerifier) {
            try { recaptchaVerifier.render().then(w => grecaptcha.reset(w)); } catch (e) {}
          }
          showError('Firebase SMS: ' + msg);
        } finally {
          btn.disabled = false;
        }
      } else {
        btn.disabled = false;
        showError('SMS OTP service is currently not configured or loading. Please contact admin.');
      }
    }

    async function verifyOtpAndRegister() {
      const code = document.getElementById('otpCode').value.trim();
      if (!code || code.length < 6) {
        showError('Please enter the 6-digit verification code.');
        return;
      }

      const btn = document.getElementById('mainActionBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying Code...';

      try {
        const userCredential = await confirmationResult.confirm(code);
        const idToken = await userCredential.user.getIdToken();
        const phone = currentPhone || userCredential.user.phoneNumber;

        await completeRegistration({ phone, firebaseIdToken: idToken });
      } catch (err) {
        showError('Invalid verification code. Please check and try again.');
        btn.disabled = false;
        btn.textContent = 'Verify Code & Enroll Shop →';
      }
    }

    async function completeRegistration(authPayload) {
      const btn = document.getElementById('mainActionBtn');
      btn.disabled = true;
      btn.textContent = 'Creating Shop Profile...';

      const payload = {
        shopName: document.getElementById('shopName').value.trim(),
        slug: document.getElementById('slug').value.trim(),
        rewardDescription: document.getElementById('reward').value.trim() || '1 Free Item',
        stampsTarget: parseInt(document.getElementById('stampsTarget').value, 10) || 10,
        ...authPayload
      };

      try {
        const res = await fetch('/api/owner/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          if (data.token) localStorage.setItem('owner_token', data.token);
          if (data.shop) localStorage.setItem('owner_shop', JSON.stringify(data.shop));
          localStorage.setItem('owner_phone', authPayload.phone);
          window.location.href = '/owner/dashboard.html';
        } else {
          showError(data.message || 'Registration failed.');
          btn.disabled = false;
          btn.textContent = isOtpSent ? 'Verify Code & Enroll Shop →' : 'Enroll Shop & Launch Counter →';
        }
      } catch (err) {
        showError('Connection error. Please try again.');
        btn.disabled = false;
      }
    }

    function showError(msg) {
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.textContent = msg;
      errorBanner.classList.remove('hidden');
    }
  </script>
</body>
</html>
