<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login · MarkU Loyalty</title>
  
  <!-- Progressive Web App (PWA) Manifest & Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MarkU">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS SDK for Google OAuth & Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    .gold-gradient-text {
      background: linear-gradient(135deg, #f6d365 0%, #d49a37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-gold {
      background: linear-gradient(135deg, #e5a83b 0%, #cb8926 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(203, 137, 38, 0.35);
      transition: all 0.2s ease;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #edb449 0%, #d9932d 100%);
      box-shadow: 0 6px 20px rgba(203, 137, 38, 0.45);
      transform: translateY(-1px);
    }

    .dark-glow-bg {
      background: radial-gradient(circle at 50% 25%, rgba(212, 154, 55, 0.12) 0%, rgba(13, 13, 14, 0.98) 65%, #0d0d0e 100%);
    }

    .glass-card {
      background: rgba(20, 20, 24, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .glass-card:hover {
      border-color: rgba(212, 154, 55, 0.25);
    }
  </style>
</head>
<body class="dark-glow-bg bg-[#0d0d0e] text-white min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-amber-500 selection:text-white">

  <!-- Ambient Golden Swirl Background Blur -->
  <div class="fixed -top-40 left-1/2 -translate-x-1/2 w-[650px] h-[350px] bg-amber-500/10 blur-[130px] pointer-events-none rounded-full"></div>

  <!-- Header with Brand Logo -->
  <header class="max-w-md w-full mx-auto pt-4 flex justify-between items-center relative z-10">
    <a href="/" class="flex items-center gap-0.5 shrink-0" title="MarkU Home">
      <span class="text-2xl font-black tracking-tight text-white">Mark</span>
      <span class="text-2xl font-black tracking-tight text-[#d99b3b] relative">
        U
        <svg class="w-3.5 h-2 absolute -top-1 right-0 text-[#d99b3b]" viewBox="0 0 14 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M1 2C4 7 10 7 13 2" />
        </svg>
      </span>
    </a>
    <a href="/" class="text-xs font-semibold text-gray-400 hover:text-white transition-colors flex items-center gap-1">
      <span>Back to Home</span>
      <span>&rarr;</span>
    </a>
  </header>

  <!-- Login Card -->
  <main class="w-full max-w-md mx-auto my-auto glass-card rounded-3xl p-6 sm:p-8 space-y-6 relative z-10">
    
    <div>
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-[#e5a83b] text-[11px] font-bold uppercase tracking-wider mb-3">
        <span>Owner Portal</span>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-white">Welcome back</h1>
      <p class="text-xs text-gray-400 mt-1">Access your counter QR kiosk, customer stamps, and reward analytics.</p>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden bg-red-950/60 border border-red-500/40 text-red-200 text-xs rounded-xl p-3.5 font-medium leading-relaxed"></div>

    <!-- Info / Success Banner -->
    <div id="infoBanner" class="hidden bg-emerald-950/60 border border-emerald-500/40 text-emerald-200 text-xs rounded-xl p-3.5 font-medium leading-relaxed"></div>



    <!-- 2. Email & Password Form -->
    <form id="emailLoginForm" onsubmit="handleEmailLogin(event)" class="space-y-4 pt-1">
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="email" class="block text-xs font-bold text-gray-300 uppercase tracking-wider">Email Address</label>
          <button type="button" id="magicLinkBtn" onclick="handleSendMagicLink()" class="text-xs text-amber-400 hover:text-amber-300 font-semibold transition-colors flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span>Email Me Magic Link</span>
          </button>
        </div>
        <input type="email" id="email" required placeholder="owner@store.com"
          class="w-full bg-[#17171c] border border-gray-800 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-amber-500 transition-all">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="block text-xs font-bold text-gray-300 uppercase tracking-wider">Password</label>
        </div>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full bg-[#17171c] border border-gray-800 focus:border-amber-500 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-1 focus:ring-amber-500 transition-all">
      </div>

      <button type="submit" id="emailLoginBtn"
        class="w-full btn-gold font-bold py-3 rounded-xl text-sm transition-all shadow-md">
        Sign In to Cockpit &rarr;
      </button>
    </form>

    <div class="text-center text-xs text-gray-400 pt-3 border-t border-gray-800/80">
      Need a shop account? <a href="/owner/register.html" class="text-[#e5a83b] font-bold hover:underline">Enroll your shop free</a>
    </div>

  </main>

  <footer class="max-w-md w-full mx-auto pb-4 text-center text-xs text-gray-500 relative z-10">
    MarkU Loyalty Platform · Simple, High-Converting Digital Loyalty
  </footer>

  <script>
    let supabaseConfig = null;
    let supabaseClient = null;

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[s]);
    }

    function showError(msg) {
      const errorBanner = document.getElementById('errorBanner');
      const infoBanner = document.getElementById('infoBanner');
      if (infoBanner) infoBanner.classList.add('hidden');
      errorBanner.textContent = msg;
      errorBanner.classList.remove('hidden');
    }

    function showInfo(msg) {
      const errorBanner = document.getElementById('errorBanner');
      const infoBanner = document.getElementById('infoBanner');
      if (errorBanner) errorBanner.classList.add('hidden');
      infoBanner.textContent = msg;
      infoBanner.classList.remove('hidden');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/config/supabase');
        supabaseConfig = await res.json();
        if (supabaseConfig.isConfigured && window.supabase) {
          supabaseClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey);

          // Check if returning from Google OAuth or Magic Link
          const { data: { session }, error } = await supabaseClient.auth.getSession();
          if (session && session.access_token) {
            await handleSupabaseAuthSuccess(session);
          }

          supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && session.access_token) {
              await handleSupabaseAuthSuccess(session);
            }
          });
        }
      } catch (err) {
        console.warn('Supabase auth init note:', err);
      }
    });

    async function handleSupabaseAuthSuccess(session) {
      const token = session.access_token;
      const user = session.user;

      try {
        const res = await fetch('/api/owner/google-auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ supabaseToken: token })
        });
        const data = await res.json();

        if (data.success) {
          if (data.needsShop) {
            window.location.href = `/owner/register.html?email=${encodeURIComponent(data.email || user.email)}`;
            return;
          }

          localStorage.setItem('owner_token', data.token);
          if (data.shop) localStorage.setItem('owner_shop', JSON.stringify(data.shop));
          window.location.href = '/owner/dashboard.html';
        } else {
          showError(data.message || 'Authentication failed. Please sign in with email.');
        }
      } catch (err) {
        console.error('Supabase auth completion error:', err);
        showError(err.message || 'Failed to authenticate. You can sign in using email.');
      }
    }

    // 1. Passwordless Email Magic Link Flow via Supabase
    async function handleSendMagicLink() {
      const errorBanner = document.getElementById('errorBanner');
      const infoBanner = document.getElementById('infoBanner');
      errorBanner.classList.add('hidden');
      infoBanner.classList.add('hidden');

      const emailInput = document.getElementById('email');
      const email = emailInput.value.trim();
      if (!email || !email.includes('@')) {
        showError('Please enter a valid email address first.');
        emailInput.focus();
        return;
      }

      const btn = document.getElementById('magicLinkBtn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span>Sending magic sign-in link...</span>';

      try {
        if (!supabaseClient) {
          throw new Error('Supabase Auth is initializing. Please try again in a moment.');
        }

        const { error } = await supabaseClient.auth.signInWithOtp({
          email: email,
          options: {
            emailRedirectTo: window.location.origin + '/owner/login.html'
          }
        });
        if (error) throw error;

        showInfo(`✓ Magic sign-in link sent to ${email}! Check your inbox and click the link to log in.`);
        btn.innerHTML = `<span class="text-emerald-400 font-bold">✓ Link Sent to ${escapeHtml(email)}</span>`;
      } catch (err) {
        console.error('Send magic link error:', err);
        showError(err.message || 'Could not send sign-in link. Please check your email and try again.');
        btn.disabled = false;
        btn.innerHTML = originalHtml;
      }
    }

    // 4. Email & Password Handler
    async function handleEmailLogin(e) {
      e.preventDefault();
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.classList.add('hidden');
      const btn = document.getElementById('emailLoginBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying credentials...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      try {
        const res = await fetch('/api/owner/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('owner_token', data.token);
          if (data.shop) localStorage.setItem('owner_shop', JSON.stringify(data.shop));
          window.location.href = '/owner/dashboard.html';
        } else {
          showError(data.message || 'Login failed. Please check your email and password.');
          btn.disabled = false;
          btn.textContent = 'Sign In to Cockpit →';
        }
      } catch (err) {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Sign In to Cockpit →';
      }
    }
  </script>
</body>
</html>
