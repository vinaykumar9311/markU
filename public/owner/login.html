<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Login · MarkU</title>
  <!-- Progressive Web App (PWA) Manifest & Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MarkU">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase SDK Compat for SMS OTP -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col justify-between p-4 antialiased">

  <!-- Header -->
  <header class="max-w-md w-full mx-auto pt-6 flex justify-between items-center">
    <a href="/" class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-indigo-600 text-white font-bold text-sm flex items-center justify-center">M</span>
      <span class="font-bold text-base tracking-tight text-gray-900">MarkU</span>
    </a>
    <a href="/" class="text-xs text-gray-500 hover:text-gray-800">Home &rarr;</a>
  </header>

  <!-- Login Card -->
  <main class="w-full max-w-md mx-auto my-auto bg-white border border-gray-200 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6">
    
    <div>
      <h1 class="text-xl font-bold text-gray-900">Shop Owner Login</h1>
      <p class="text-sm text-gray-500 mt-1">Access your counter display, customer list, and reward rules.</p>
    </div>

    <!-- Toggle between Phone and Email -->
    <div class="flex border-b border-gray-200 text-xs font-semibold">
      <button id="tabPhone" onclick="switchTab('phone')" class="pb-2.5 px-3 border-b-2 border-indigo-600 text-indigo-600 font-bold transition-all">
        Mobile Number (OTP)
      </button>
      <button id="tabEmail" onclick="switchTab('email')" class="pb-2.5 px-3 border-b-2 border-transparent text-gray-500 hover:text-gray-900 transition-all">
        Email & Password
      </button>
    </div>

    <div id="errorBanner" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl p-3"></div>

    <!-- 1. Phone Login Form -->
    <form id="phoneLoginForm" onsubmit="handleSendPhoneLogin(event)" class="space-y-4">
      <div id="loginPhoneGroup">
        <label for="loginPhone" class="block text-xs font-semibold text-gray-700 mb-1">Owner Mobile Number</label>
        <input type="tel" id="loginPhone" required placeholder="+919876543210"
          class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm text-gray-900 font-mono focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>

      <div id="recaptcha-container"></div>

      <div id="loginOtpGroup" class="hidden space-y-2">
        <label for="loginOtpCode" class="block text-xs font-semibold text-gray-700">6-Digit SMS Verification Code</label>
        <input type="text" id="loginOtpCode" maxlength="6" placeholder="123456"
          class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-base font-mono text-center tracking-widest text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <div class="flex justify-between items-center text-xs text-gray-500">
          <span id="loginTargetPhone">Sent to mobile</span>
          <button type="button" onclick="backToPhoneLogin()" class="text-indigo-600 hover:underline">Change</button>
        </div>
      </div>

      <button type="submit" id="phoneLoginBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-sm">
        Send Login Code &rarr;
      </button>
    </form>

    <!-- 2. Email Login Form (Hidden by default) -->
    <form id="emailLoginForm" onsubmit="handleEmailLogin(event)" class="hidden space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-gray-700 mb-1.5">Email Address</label>
        <input type="email" id="email" placeholder="owner@store.com"
          class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Password</label>
        <input type="password" id="password" placeholder="••••••••"
          class="w-full bg-white border border-gray-300 rounded-xl px-3.5 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
      </div>

      <button type="submit" id="emailLoginBtn"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-sm">
        Sign In with Email
      </button>
    </form>

    <div class="text-center text-xs text-gray-500 pt-3 border-t border-gray-100">
      Need an account? <a href="/owner/register.html" class="text-indigo-600 font-semibold hover:underline">Enroll your shop</a>
    </div>

  </main>

  <footer class="max-w-md w-full mx-auto pb-6 text-center text-xs text-gray-400">
    MarkU Loyalty Platform
  </footer>

  <script>
    let firebaseConfig = null;
    let confirmationResult = null;
    let recaptchaVerifier = null;
    let isOtpSent = false;
    let targetPhone = '';

    window.addEventListener('DOMContentLoaded', async () => {
      const savedPhone = localStorage.getItem('owner_phone');
      if (savedPhone) {
        document.getElementById('loginPhone').value = savedPhone;
      }

      try {
        const res = await fetch('/api/config/firebase');
        firebaseConfig = await res.json();
        if (firebaseConfig.isConfigured && window.firebase) {
          firebase.initializeApp(firebaseConfig);
          recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
        } else {
          document.getElementById('phoneLoginBtn').textContent = 'Sign In to Dashboard →';
        }
      } catch (err) {
        console.warn('Firebase config:', err);
      }
    });

    function switchTab(mode) {
      document.getElementById('errorBanner').classList.add('hidden');
      if (mode === 'phone') {
        document.getElementById('phoneLoginForm').classList.remove('hidden');
        document.getElementById('emailLoginForm').classList.add('hidden');
        document.getElementById('tabPhone').className = 'pb-2.5 px-3 border-b-2 border-indigo-600 text-indigo-600 font-bold transition-all';
        document.getElementById('tabEmail').className = 'pb-2.5 px-3 border-b-2 border-transparent text-gray-500 hover:text-gray-900 transition-all';
      } else {
        document.getElementById('phoneLoginForm').classList.add('hidden');
        document.getElementById('emailLoginForm').classList.remove('hidden');
        document.getElementById('tabEmail').className = 'pb-2.5 px-3 border-b-2 border-indigo-600 text-indigo-600 font-bold transition-all';
        document.getElementById('tabPhone').className = 'pb-2.5 px-3 border-b-2 border-transparent text-gray-500 hover:text-gray-900 transition-all';
      }
    }

    function backToPhoneLogin() {
      isOtpSent = false;
      document.getElementById('loginPhoneGroup').classList.remove('hidden');
      document.getElementById('loginOtpGroup').classList.add('hidden');
      document.getElementById('phoneLoginBtn').textContent = 'Send Login Code →';
    }

    async function handleSendPhoneLogin(e) {
      e.preventDefault();
      document.getElementById('errorBanner').classList.add('hidden');

      if (isOtpSent) {
        await verifyOtpAndLogin();
        return;
      }

      let raw = document.getElementById('loginPhone').value.trim();
      let cleaned = raw.replace(/[\s\-\(\)]/g, '');
      if (!cleaned.startsWith('+')) {
        if (cleaned.length === 10) cleaned = '+91' + cleaned;
        else cleaned = '+' + cleaned;
      }

      if (!cleaned || cleaned.length < 10) {
        showError('Please enter a valid 10-digit mobile number.');
        return;
      }
      targetPhone = cleaned;

      const btn = document.getElementById('phoneLoginBtn');
      btn.disabled = true;

      if (firebaseConfig && firebaseConfig.isConfigured && window.firebase) {
        btn.textContent = 'Sending SMS...';
        try {
          if (!recaptchaVerifier) {
            recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
          }
          confirmationResult = await firebase.auth().signInWithPhoneNumber(targetPhone, recaptchaVerifier);
          isOtpSent = true;
          document.getElementById('loginPhoneGroup').classList.add('hidden');
          document.getElementById('loginOtpGroup').classList.remove('hidden');
          document.getElementById('loginTargetPhone').textContent = `Code sent to ${targetPhone}`;
          btn.textContent = 'Verify Code & Sign In →';
        } catch (err) {
          console.error(err);
          const msg = err.message || '';
          if (window.grecaptcha && recaptchaVerifier) {
            try { recaptchaVerifier.render().then(w => grecaptcha.reset(w)); } catch (e) {}
          }
          showError('Firebase SMS: ' + msg);
        } finally {
          btn.disabled = false;
        }
      } else {
        btn.disabled = false;
        showError('SMS OTP service is currently not configured or loading. Please use Email & Password.');
      }
    }

    async function verifyOtpAndLogin() {
      const code = document.getElementById('loginOtpCode').value.trim();
      if (!code || code.length < 6) {
        showError('Please enter the 6-digit verification code.');
        return;
      }

      const btn = document.getElementById('phoneLoginBtn');
      btn.disabled = true;
      btn.textContent = 'Verifying Code...';

      try {
        const userCredential = await confirmationResult.confirm(code);
        const idToken = await userCredential.user.getIdToken();
        const phone = targetPhone || userCredential.user.phoneNumber;

        await executeLogin({ phone, firebaseIdToken: idToken });
      } catch (err) {
        showError('Invalid verification code.');
        btn.disabled = false;
        btn.textContent = 'Verify Code & Sign In →';
      }
    }

    async function handleEmailLogin(e) {
      e.preventDefault();
      document.getElementById('errorBanner').classList.add('hidden');
      const btn = document.getElementById('emailLoginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      await executeLogin({ email, password });
      btn.disabled = false;
      btn.textContent = 'Sign In with Email';
    }

    async function executeLogin(payload) {
      try {
        const res = await fetch('/api/owner/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('owner_token', data.token);
          if (data.shop) localStorage.setItem('owner_shop', JSON.stringify(data.shop));
          if (payload.phone) localStorage.setItem('owner_phone', payload.phone);
          window.location.href = '/owner/dashboard.html';
        } else {
          showError(data.message || 'Login failed.');
        }
      } catch (err) {
        showError('Connection error. Please try again.');
      }
    }

    function showError(msg) {
      const errorBanner = document.getElementById('errorBanner');
      errorBanner.textContent = msg;
      errorBanner.classList.remove('hidden');
    }
  </script>
</body>
</html>
